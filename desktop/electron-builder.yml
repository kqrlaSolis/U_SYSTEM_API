appId: dev.usystem.desktop
productName: U SYSTEM
copyright: U SYSTEM

directories:
  output: release
  buildResources: build

# El renderer compilado y el proceso principal/.preload viajan dentro del asar
files:
  - dist/**
  - dist-electron/**
  - package.json

# Icono de la ventana en la app empaquetada (ver electron/Main.ts)
extraResources:
  - from: build/icon.png
    to: icon.png

asar: true

win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: U SYSTEM

linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Education
  artifactName: ${productName}-${version}.${ext}

mac:
  icon: build/icon.png
  target:
    - dmg
  category: public.app-category.education
  artifactName: ${productName}-${version}.${ext}
