# Integración continua de U SYSTEM: API en .NET 8.
# El desktop vive en su propio repo, por eso aquí solo se construye y prueba la API.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  api:
    name: API (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar
        run: dotnet restore USystem.sln

      - name: Compilar
        run: dotnet build USystem.sln --no-restore --configuration Release

      - name: Pruebas
        run: dotnet test USystem.sln --no-build --configuration Release --logger "console;verbosity=minimal"

      - name: Formato
        run: dotnet format USystem.sln --verify-no-changes --severity warn
